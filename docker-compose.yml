x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.10
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow_db
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    PYTHONPATH: /opt/airflow
    # Pipeline code writes to the analytics warehouse, not Airflow's metadata DB
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-traffic_accidents}
    MLFLOW_TRACKING_URI: http://mlflow:5000
    ACCIDENT_BATCH_SIZE: ${ACCIDENT_BATCH_SIZE:-}
    WEATHER_GRID_DEG: ${WEATHER_GRID_DEG:-1.0}
    # Project dependencies needed by the DAG tasks (development convenience; bake a custom image for production)
    _PIP_ADDITIONAL_REQUIREMENTS: "python-dotenv scipy scikit-learn>=1.6,<1.7 lightgbm>=4.1,<5 xgboost>=2.0,<4 imbalanced-learn>=0.12,<0.15 mlflow>=3.1,<4 matplotlib"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ./datasets:/opt/airflow/datasets
    - ./models:/opt/airflow/models
    - ./reports:/opt/airflow/reports

services:
  # 1. PostgreSQL + PostGIS warehouse (also hosts Airflow's metadata DB)
  postgres:
    image: postgis/postgis:15-3.4
    container_name: traffic_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-traffic_accidents}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs 00_init.sql (airflow_db), then the warehouse DDL, marts and PostGIS setup
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-traffic_accidents}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. MLflow Tracking Server + Model Registry (SQLite backend, artifacts served by the server)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.4.0
    container_name: traffic_mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0 --port 5000

  # 3. Apache Airflow metadata migration & admin user
  airflow-init:
    <<: *airflow-common
    container_name: traffic_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true"

  # 4. Apache Airflow Webserver & Scheduler
  airflow-webserver:
    <<: *airflow-common
    container_name: traffic_airflow_webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    container_name: traffic_airflow_scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_started
    command: scheduler

  # 5. FastAPI Inference Microservice
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: traffic_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-traffic_accidents}
      MODEL_PATH: /app/models/accident_severity_model.joblib
    depends_on:
      postgres:
        condition: service_healthy

  # 6. Streamlit Analytics & Prediction Dashboard
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: traffic_streamlit
    restart: always
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-traffic_accidents}
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mlflow_data:
